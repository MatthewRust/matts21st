<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Matthew's 21st">
  <!--
    Wax seal, matching the invitation styling: seal red (#7b1a1a) with a gold
    keyline and parchment numerals.

    Kept to three shapes on purpose. A favicon is usually seen at 16px, where
    scalloped seal edges or a drop shadow turn into mud — the disc, ring and
    numerals are the only parts that survive at that size.
  -->
  <circle cx="32" cy="32" r="31" fill="#7b1a1a"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#c9a25b" stroke-width="1.6" opacity="0.85"/>
  <text x="32" y="33"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Cormorant Garamond', serif"
        font-size="34" font-weight="600" letter-spacing="-0.5"
        fill="#f7f1e3">21</text>
</svg>
