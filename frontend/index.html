<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG only, deliberately. Safari has supported SVG favicons since 16.4,
         so this covers current iOS as well as desktop. A PNG apple-touch-icon
         would additionally cover home-screen bookmarks on older iOS, but the
         one generated previously shipped corrupt and rendered as coloured
         banding on iPhone — better no icon than a broken one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tints the browser chrome on mobile to match the sticky navbar. -->
    <meta name="theme-color" content="#0c0a09" />

    <meta name="description" content="Everything for Matthew's 21st in Braemar — travel, schedule, packing and photos." />

    <title>Matthew's 21st</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
