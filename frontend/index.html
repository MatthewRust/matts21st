    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG favicon stays crisp at every size and is what desktop browsers
         pick up. The PNG is the fallback for iOS, which ignores SVG icons and
         uses this for home-screen bookmarks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Tints the browser chrome on mobile to match the sticky navbar. -->
    <meta name="theme-color" content="#0c0a09" />

    <meta name="description" content="Everything for Matthew's 21st in Braemar — travel, schedule, packing and photos." />

    <title>Matthew's 21st</title>
