name: API Health Check

on:
  schedule:
    # Free Render services sleep after 15 minutes idle. GitHub's scheduler runs
    # on a best-effort basis and is routinely several minutes late under load,
    # so 14 would regularly slip past the window — 10 leaves headroom.
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://matts21st-backend.onrender.com/api/health
